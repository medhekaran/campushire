# Database: values come from the hosting platform, never from code
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Never let Hibernate alter real tables in production
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Cookie is now sent only over HTTPS
server.servlet.session.cookie.secure=true

# The host terminates HTTPS and forwards plain HTTP to your app; this tells Spring to trust that
server.forward-headers-strategy=framework

# Hosts give you the port through an environment variable
server.port=${PORT:8080}

# Your real site address (set in Step 3)
campushire.allowed-origin=${ALLOWED_ORIGIN}