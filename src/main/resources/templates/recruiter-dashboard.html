<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Recruiter Dashboard - CampusHire')}"></head>
<body>
<div class="ch-topbar">
    <a class="brand" th:href="@{/}">Campus<span>Hire</span></a>
    <button onclick="logout()">Log out</button>
</div>

<div class="container py-4">
    <div class="row g-4">
        <div class="col-lg-4">
            <div class="ch-form-card">
                <h3 class="mb-3" style="font-size:1.3rem;">Post a drive</h3>
                <div id="formMsg" class="alert d-none"></div>
                <form id="driveForm">
                    <div class="mb-3">
                        <label class="form-label">Company name</label>
                        <input type="text" class="form-control" id="companyName" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Job title</label>
                        <input type="text" class="form-control" id="jobTitle" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Package (LPA)</label>
                        <input type="number" step="0.1" min="0" class="form-control" id="packageLpa" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Minimum CGPA</label>
                        <input type="number" step="0.1" min="0" max="10" class="form-control" id="minCgpa" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Backlogs allowed</label>
                        <input type="number" min="0" class="form-control" id="allowedBacklogs" value="0" required>
                    </div>
                    <button type="submit" class="btn btn-ch-primary w-100">Post drive</button>
                </form>
            </div>
        </div>

        <div class="col-lg-8">
            <h3 class="mb-3">Your drives</h3>
            <div id="drivesContainer"></div>
        </div>
    </div>
</div>

<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/recruiter-dashboard.js}"></script>
</body>
</html>
