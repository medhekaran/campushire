<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Student Dashboard - CampusHire')}"></head>
<body>
<div class="ch-topbar">
    <a class="brand" th:href="@{/}">Campus<span>Hire</span></a>
    <button onclick="logout()">Log out</button>
</div>

<div class="container py-4">
    <div class="row g-4">
        <div class="col-lg-4">
            <div class="ch-form-card">
                <h3 class="mb-3" style="font-size:1.3rem;">Your profile</h3>
                <div id="profileMsg" class="alert d-none"></div>
                <form id="profileForm">
                    <div class="mb-3">
                        <label class="form-label">Branch</label>
                        <select class="form-select" id="branch" required>
                            <option value="Computer Engineering">Computer Engineering</option>
                            <option value="Information Technology">Information Technology</option>
                            <option value="Mechanical Engineering">Mechanical Engineering</option>
                            <option value="Civil Engineering">Civil Engineering</option>
                            <option value="Electrical Engineering">Electrical Engineering</option>
                            <option value="Electronics &amp; Telecommunication">Electronics &amp; Telecommunication</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">CGPA</label>
                        <input type="number" step="0.01" min="0" max="9.99" class="form-control" id="cgpa" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Active backlogs</label>
                        <input type="number" min="0" class="form-control" id="backlogs" value="0" required>
                    </div>
                    <button type="submit" class="btn btn-ch-primary w-100">Save profile</button>
                </form>
            </div>
        </div>

        <div class="col-lg-8">
            <div id="actionMsg" class="alert d-none"></div>
            <h3 class="mb-3">Drives you can apply to</h3>
            <div id="drivesContainer" class="row g-3 mb-5"></div>

            <h3 class="mb-3">My applications</h3>
            <div id="applicationsContainer"></div>
        </div>
    </div>
</div>

<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/student-dashboard.js}"></script>
</body>
</html>
