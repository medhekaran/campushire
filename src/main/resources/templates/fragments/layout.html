<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">CampusHire</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:fragment="navbar" class="ch-navbar">
    <a class="brand" th:href="@{/}">Campus<span>Hire</span></a>
    <div>
        <a class="btn-ghost" th:href="@{/login}">Login</a>
        <a class="btn-ghost btn-solid" th:href="@{/register}">Register</a>
    </div>
</nav>
<footer th:fragment="footer" class="text-center py-4 mt-5" style="color:#6B7088; font-size:0.9rem;">
    &copy; 2026 CampusHire — built for placement season
</footer>
</body>
</html>
